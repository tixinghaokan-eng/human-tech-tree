<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="color-scheme" content="dark">
<title>人类科技树</title>
<style>
  :root{
    --bg:#070a0f; --line:#1d2734; --txt:#dce5ef; --dim:#7a8899; --accent:#5aa9e6;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--txt);
    -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;
    font-family:-apple-system,"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  }

  /* ── 画布 ─────────────────────────────── */
  #tree{position:absolute; top:0; left:0; right:0; bottom:0; width:100%; height:100%;
    touch-action:none; cursor:grab;
    background:radial-gradient(circle at 32% 18%, #101a28 0%, #070a0f 62%)}
  #tree.grabbing{cursor:grabbing}

  .band{fill:#ffffff05}
  .band.alt{fill:#ffffff0b}
  .era-line{stroke:#ffffff12; stroke-width:1}

  .edge{fill:none; stroke:#26313f; stroke-width:1.15; transition:stroke .16s,opacity .16s,stroke-width .16s}
  .edge.hl{stroke:var(--accent); stroke-width:2; opacity:1}
  .edge.dim{opacity:.07}

  .node{cursor:pointer; transition:opacity .16s}
  .node .body{fill:#131b26; stroke:#2b3849; stroke-width:1; transition:stroke .16s,fill .16s}
  .node .accent{fill:currentColor; opacity:.9}
  .node .nm{fill:#dce5ef; font-size:13.5px}
  .node .yr{fill:#6e7d90; font-size:10.5px}
  .node.rel .body{stroke:currentColor; stroke-width:1.4; fill:#18222f}
  .node.sel .body{stroke:#ffffff; stroke-width:1.8; fill:#1b2735}
  .node.hit .body{stroke:#ffffff; stroke-width:1.6}
  .node.dim{opacity:.13}

  /* ── 时代轴 ───────────────────────────── */
  #axis{position:absolute; left:0; right:0; top:var(--hdr,58px); height:34px; z-index:4; overflow:hidden;
    pointer-events:none; border-bottom:1px solid #ffffff0f;
    background:linear-gradient(#070a0ff2 55%,#070a0f99 80%,#070a0f00)}
  #axis .ey{position:absolute; top:0; height:34px; display:flex; flex-direction:column; align-items:center;
    justify-content:center; overflow:hidden; white-space:nowrap; border-left:1px solid #ffffff14}
  #axis .ey b{font-size:12px; font-weight:600; color:#9db0c4; letter-spacing:.06em}
  #axis .ey s{font-size:10px; color:#5a6a7d; text-decoration:none; margin-top:1px}
  #axis .ey.narrow s{display:none}
  #axis .ey.hide{display:none}

  /* ── 顶栏 ─────────────────────────────── */
  header{position:absolute; top:0; left:0; right:0; z-index:5; display:flex; align-items:center; gap:12px;
    padding:12px 14px; pointer-events:none; flex-wrap:wrap;
    background:linear-gradient(#070a0fee,#070a0f00)}
  header>*{pointer-events:auto}
  h1{margin:0; font-size:15px; font-weight:600; letter-spacing:.08em; white-space:nowrap}
  h1 span{color:var(--dim); font-size:11.5px; font-weight:400; margin-left:8px; letter-spacing:0}

  .search{position:relative; flex:0 1 210px; min-width:140px}
  .search input{width:100%; padding:7px 12px; font-size:13px; color:var(--txt); outline:none;
    -webkit-appearance:none; appearance:none;
    border:1px solid var(--line); border-radius:9px; background:#0c121b}
  .search input:focus{border-color:#31506f}
  #results{position:absolute; top:112%; left:0; right:0; z-index:9; display:none;
    max-height:290px; overflow-y:auto; background:#0f1722; border:1px solid var(--line); border-radius:10px}
  #results.open{display:block}
  .res{display:flex; gap:8px; justify-content:space-between; align-items:baseline; width:100%;
    padding:7px 11px; font-size:12.5px; color:var(--txt); text-align:left; background:none; border:0; cursor:pointer}
  .res:hover{background:#182130}
  .res span{color:var(--dim); font-size:11px; white-space:nowrap}

  .legend{display:flex; gap:6px; flex-wrap:wrap; margin-left:auto}
  .lg{display:flex; align-items:center; gap:5px; padding:4px 10px; font-size:11.5px; color:var(--dim);
    flex:0 0 auto; white-space:nowrap;
    background:#0c121b; border:1px solid var(--line); border-radius:999px; cursor:pointer; transition:.15s}
  .lg i{width:8px; height:8px; border-radius:50%; background:currentColor}
  .lg:hover{color:var(--txt)}
  .lg.on{color:var(--txt); background:#17212e; border-color:#31435a}

  .tools{display:flex; gap:6px}
  .tools button{height:30px; min-width:32px; padding:0 9px; font-size:12.5px; color:var(--txt);
    background:#0c121b; border:1px solid var(--line); border-radius:9px; cursor:pointer}
  .tools button:hover{background:#17212e}

  /* ── 详情面板 ─────────────────────────── */
  #panel{position:absolute; top:66px; right:14px; z-index:6; width:344px; max-height:calc(100% - 96px);
    overflow-y:auto; padding:18px; background:#0e151ff2; border:1px solid var(--line); border-radius:14px;
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    opacity:0; transform:translateX(18px); pointer-events:none; transition:.22s ease}
  #panel.open{opacity:1; transform:none; pointer-events:auto}
  #panel .close{position:absolute; top:10px; right:12px; font-size:20px; line-height:1; color:var(--dim);
    background:none; border:0; cursor:pointer}
  #panel .close:hover{color:var(--txt)}
  #panel .catline{width:36px; height:3px; border-radius:2px; margin-bottom:12px}
  #panel h2{margin:0 0 10px; font-size:19px; font-weight:600}
  #panel .meta{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px}
  #panel .tag{padding:3px 9px; font-size:11px; color:#a9b8c9; background:#141d29;
    border:1px solid var(--line); border-radius:999px}
  #panel p{margin:0; font-size:13px; line-height:1.75; color:#a6b4c4}
  #panel h3{margin:18px 0 8px; font-size:11px; font-weight:600; letter-spacing:.12em; color:var(--dim)}
  .chips{display:flex; flex-wrap:wrap; gap:6px}
  .chip{display:flex; align-items:center; gap:6px; padding:5px 9px; font-size:12px; color:var(--txt);
    background:#141d29; border:1px solid var(--line); border-radius:8px; cursor:pointer}
  .chip:hover{background:#1b2533; border-color:#33445c}
  .chip i{width:6px; height:6px; border-radius:50%; background:var(--c,#666); flex:0 0 auto}
  .chip em{font-style:normal; color:var(--dim); font-size:10.5px}

  /* ── 缩略图与提示 ─────────────────────── */
  #mini{position:absolute; right:14px; bottom:14px; z-index:5; padding:6px; cursor:pointer;
    background:#0b111acc; border:1px solid var(--line); border-radius:10px}
  #mini svg{display:block; width:190px}
  #mini .vp{fill:#5aa9e626; stroke:#5aa9e6; stroke-width:6; vector-effect:non-scaling-stroke}
  #hint{position:absolute; left:16px; bottom:16px; z-index:4; font-size:11.5px; color:#57677a; pointer-events:none}

  @media (max-width:780px){
    header{padding:10px; gap:8px}
    h1{font-size:13px} h1 span{display:none}
    .legend{order:3; width:100%; margin-left:0; flex-wrap:nowrap; overflow-x:auto; padding-bottom:2px;
      scrollbar-width:none}
    .legend::-webkit-scrollbar{display:none}
    .tools{margin-left:auto}
    #panel{top:auto; left:10px; right:10px; bottom:10px; width:auto; max-height:46vh; border-radius:16px;
      transform:translateY(18px)}
    #panel.open{transform:none}
    #mini svg{width:132px}
    #hint{display:none}
  }
</style>
</head>
<body>

<div id="axis"></div>

<svg id="tree" xmlns="http://www.w3.org/2000/svg">
  <g id="world">
    <g id="bands"></g>
    <g id="edges"></g>
    <g id="nodes"></g>
  </g>
</svg>

<header>
  <h1>人类科技树<span id="stat"></span></h1>
  <div class="search">
    <input id="q" type="search" placeholder="搜索技术、年代…" autocomplete="off">
    <div id="results"></div>
  </div>
  <div class="legend" id="legend"></div>
  <div class="tools">
    <button data-act="out" title="缩小">−</button>
    <button data-act="in" title="放大">+</button>
    <button data-act="fit" title="显示全图">适应</button>
    <button data-act="reset" title="回到起点">100%</button>
  </div>
</header>

<aside id="panel"></aside>
<div id="mini"><svg xmlns="http://www.w3.org/2000/svg"></svg></div>
<div id="hint">滚轮 / 双指缩放 · 拖拽平移 · 点击节点查看前置与衍生</div>

<script>
/* 人类科技树数据集
   节点 = 一项技术 / 一门学问；pre = 前置条件（有向边：前置 -> 本节点） */

const ERAS = [
  { name: '旧石器时代', sub: '约260万年前 – 前1万年' },
  { name: '农业革命', sub: '前1万年 – 前3500年' },
  { name: '古典文明', sub: '前3500 – 公元500年' },
  { name: '中世纪', sub: '500 – 1400年' },
  { name: '文艺复兴与大航海', sub: '1400 – 1700年' },
  { name: '工业革命', sub: '1700 – 1870年' },
  { name: '电气与化工', sub: '1870 – 1945年' },
  { name: '信息时代', sub: '1945 – 2000年' },
  { name: '智能时代', sub: '2000年 – 至今' },
];

const NODES = [
  /* ── 0 旧石器时代 ───────────────────────────── */
  { id: 'stone', name: '打制石器', era: 0, year: '约260万年前', cat: 'material',
    desc: '敲击石核剥下锋利石片，人类第一项「可复制」的技术。它把捕猎、切割、刮削的能力从身体外置到工具上。', pre: [] },
  { id: 'fire', name: '用火', era: 0, year: '约100万年前', cat: 'energy',
    desc: '掌握取火与保火，等于拥有了第一份可调用的能量：取暖、驱兽、夜间活动，最终通向烹饪与冶炼。', pre: ['stone'] },
  { id: 'clothing', name: '缝制衣物', era: 0, year: '约10万年前', cat: 'material',
    desc: '骨针与皮绳让人类得以离开热带，是走出非洲、进入寒带的前提。', pre: ['stone'] },
  { id: 'weaving', name: '编织与纺织', era: 0, year: '约3万年前', cat: 'material',
    desc: '把纤维捻成线、再交织成面。绳索与织物后来成为帆、纸、弓弦与机器皮带的共同源头。', pre: ['clothing'] },
  { id: 'spear', name: '长矛', era: 0, year: '约40万年前', cat: 'mech',
    desc: '把杠杆与臂力结合的第一件复合工具，让人类成为顶级掠食者。', pre: ['stone'] },
  { id: 'bow', name: '弓箭', era: 0, year: '约6万年前', cat: 'mech',
    desc: '用弹性势能储能再瞬间释放，第一次让「储能」成为设计目标。', pre: ['spear'] },
  { id: 'fishing', name: '渔网与骨钩', era: 0, year: '约4万年前', cat: 'life',
    desc: '从陆地向水域扩展食物来源，定居点第一次可以沿河海岸长期驻扎。', pre: ['clothing'] },
  { id: 'language', name: '语言', era: 0, year: '约10万年前', cat: 'info',
    desc: '可无限组合的符号系统。技术从此可以跨代累积，而不必每次从头发明。', pre: [] },
  { id: 'cave_art', name: '洞穴壁画与仪式', era: 0, year: '约4万年前', cat: 'info',
    desc: '最早的「外部存储」：把信息写在身体之外，是文字与符号思维的预演。', pre: ['language'] },
  { id: 'counting', name: '计数与记账', era: 0, year: '约4万年前', cat: 'info',
    desc: '刻痕、绳结、算筹，把数量抽象成可操作的对象，数字与账目由此开始。', pre: ['language'] },

  /* ── 1 农业革命 ─────────────────────────────── */
  { id: 'pottery', name: '陶器', era: 1, year: '约2万年前', cat: 'material',
    desc: '用火改造黏土——人类第一次合成自然界不存在的材料，也第一次拥有可长期储粮的容器。', pre: ['fire'] },
  { id: 'mining', name: '采矿', era: 1, year: '约8000年前', cat: 'material',
    desc: '为了燧石、盐与颜料深入地下，随后挖出的是矿石与金属，也挖出了地下工程。', pre: ['fire', 'stone'] },
  { id: 'copper', name: '铜冶炼', era: 1, year: '约7000年前', cat: 'material',
    desc: '把石头加热到熔融并浇铸成型，材料第一次可以被「重铸」，不再受原石形状约束。', pre: ['fire', 'pottery', 'mining'] },
  { id: 'agriculture', name: '农业', era: 1, year: '约1.1万年前', cat: 'life',
    desc: '把狩猎采集的随机供给，变成可预测、可储存、可征税的产出。人口、城市与国家都建立在这之上。', pre: ['fire', 'stone', 'pottery'] },
  { id: 'domestication', name: '驯化动植物', era: 1, year: '约1.1万年前', cat: 'life',
    desc: '让其他物种按人类需求繁殖，本质是对基因组的长期定向筛选，早于基因概念一万年。', pre: ['bow'] },
  { id: 'dwelling', name: '定居聚落', era: 1, year: '约1万年前', cat: 'mech',
    desc: '泥砖与木构把「临时营地」变成固定资产，从此有了储藏、邻里与围墙。', pre: ['stone', 'fire'] },
  { id: 'calendar', name: '历法', era: 1, year: '约8000年前', cat: 'science',
    desc: '观测日月星辰以预判季节，是农业需要的时序知识，也是天文学与数学的起点。', pre: ['agriculture'] },
  { id: 'irrigation', name: '灌溉', era: 1, year: '约6000年前', cat: 'life',
    desc: '把河流改造成可调度的供给系统，同时催生了水利工程与集中管理的社会组织。', pre: ['agriculture'] },
  { id: 'wheel', name: '轮子', era: 1, year: '约5500年前', cat: 'mech',
    desc: '把滑动摩擦换成滚动摩擦，运输、制陶轮与水轮都源于同一项几何洞察。', pre: ['agriculture', 'mining'] },
  { id: 'sail', name: '帆船', era: 1, year: '约7000年前', cat: 'mech',
    desc: '第一次利用自然界的流体动力，让货物与观念可以跨越海洋而非绕过海岸。', pre: ['weaving', 'dwelling'] },
  { id: 'herbal', name: '草药与外科', era: 1, year: '约6000年前', cat: 'life',
    desc: '对植物药性与人体损伤的系统经验，是医学在没有生理学之前的全部家底。', pre: ['agriculture'] },

  /* ── 2 古典文明 ─────────────────────────────── */
  { id: 'bronze', name: '青铜', era: 2, year: '前3300年', cat: 'material',
    desc: '合金化让金属同时具备硬度与韧性。青铜兵器与礼器支撑起第一批国家和常备军。', pre: ['copper', 'mining'] },
  { id: 'glass', name: '玻璃', era: 2, year: '前3500年', cat: 'material',
    desc: '高温下熔融石英得到的透明材料，两千年后成为透镜、望远镜与光纤的基础。', pre: ['pottery', 'copper'] },
  { id: 'writing', name: '文字', era: 2, year: '前3200年', cat: 'info',
    desc: '把语言编码为可持久、可远距离传输的符号，法律、宗教、科学与官僚制度都靠它运行。', pre: ['counting', 'agriculture'] },
  { id: 'papyrus', name: '莎草纸与笔墨', era: 2, year: '前3000年', cat: 'info',
    desc: '廉价书写载体的出现，让文字从神庙走向市场与书房。', pre: ['writing', 'weaving'] },
  { id: 'alphabet', name: '字母文字', era: 2, year: '前1000年', cat: 'info',
    desc: '把音节或音素映射为少量符号，识字所需记忆量骤减，文字从祭司阶层扩散到普通商人。', pre: ['writing'] },
  { id: 'math', name: '数学', era: 2, year: '前3000年', cat: 'science',
    desc: '从丈量土地、分配粮食与计算税赋中抽象出的形式系统，是其余一切科学的通用语言。', pre: ['writing', 'counting'] },
  { id: 'geometry', name: '几何学', era: 2, year: '前2000年', cat: 'science',
    desc: '把空间关系变成可证明的定理，建筑、天文与后来的机械设计都建立在它之上。', pre: ['math'] },
  { id: 'astronomy', name: '天文学', era: 2, year: '前2000年', cat: 'science',
    desc: '精确记录天体运动，既用于授时与导航，也提供了最早可检验的自然规律模型。', pre: ['calendar', 'math'] },
  { id: 'medicine', name: '系统医学', era: 2, year: '前400年', cat: 'life',
    desc: '把疾病从神罚解释转向自然原因与临床观察，形成可传授的诊断与预后体系。', pre: ['herbal', 'writing'] },
  { id: 'iron', name: '冶铁', era: 2, year: '前1200年', cat: 'material',
    desc: '铁矿石分布远比铜锡广泛，更高炉温与渗碳工艺让工具廉价到可以普及到农夫手中。', pre: ['bronze', 'mining'] },
  { id: 'steel', name: '钢', era: 2, year: '前300年', cat: 'material',
    desc: '控制含碳量的铁：硬度与韧性的可调平衡，后来成为几乎所有机械与结构的骨架。', pre: ['iron'] },
  { id: 'concrete', name: '混凝土', era: 2, year: '前200年', cat: 'material',
    desc: '把火山灰、石灰与骨料拌合成可塑材料，硬化后抗压如水石，罗马用它浇筑了整个帝国。', pre: ['stone_arch', 'mining'] },
  { id: 'stone_arch', name: '石砌建筑与拱券', era: 2, year: '前3000年', cat: 'mech',
    desc: '把石头的压应力沿拱线传递，第一次用几何而非材料强度来支撑巨大重量。', pre: ['dwelling', 'bronze'] },
  { id: 'road', name: '道路网', era: 2, year: '前3000年', cat: 'mech',
    desc: '标准化的路基与里程，把分散的聚落连成可被统一调度的一整个帝国。', pre: ['wheel', 'dwelling'] },
  { id: 'aqueduct', name: '渡槽与城市供水', era: 2, year: '前300年', cat: 'mech',
    desc: '依靠重力与恒定坡度长距离输水，使百万人口的城市第一次在卫生上可行。', pre: ['stone_arch', 'concrete'] },
  { id: 'lever', name: '杠杆与简单机械', era: 2, year: '前300年', cat: 'mech',
    desc: '阿基米德把力与力臂的关系写成可计算的比例，机械设计第一次有了理论。', pre: ['geometry'] },
  { id: 'gear', name: '齿轮', era: 2, year: '前300年', cat: 'mech',
    desc: '用齿形啮合传递转速与扭矩，同时把「传动」从简单机械中独立出来。', pre: ['wheel', 'lever'] },
  { id: 'waterwheel', name: '水车与水磨', era: 2, year: '前300年', cat: 'energy',
    desc: '第一次让非生物动力持续驱动磨盘与风箱，是「动力自由」的长期来源。', pre: ['gear', 'wheel'] },
  { id: 'catapult', name: '弩炮与攻城机械', era: 2, year: '前400年', cat: 'mech',
    desc: '把弹性与扭簧储能、齿轮与棘轮结合成可重复发射的机械，工程与军事首次深度绑定。', pre: ['lever', 'gear'] },
  { id: 'horse_harness', name: '马具与马镫', era: 2, year: '前500年', cat: 'mech',
    desc: '颈圈、挽具与马镫把畜力高效接入运输与战争，也改变了欧亚大陆的权力格局。', pre: ['domestication', 'wheel'] },
  { id: 'paper', name: '造纸', era: 2, year: '105年', cat: 'info',
    desc: '用植物纤维打浆抄造成廉价的书写面，信息复制的成本因此下降一个数量级。', pre: ['weaving', 'writing'] },

  /* ── 3 中世纪 ───────────────────────────────── */
  { id: 'gunpowder', name: '火药', era: 3, year: '约850年', cat: 'energy',
    desc: '硝石、硫磺与木炭的配比，是第一种可控的化学爆炸——化学能第一次被当作动力使用。', pre: ['pottery', 'mining'] },

  { id: 'calculus', name: '微积分', era: 4, year: '1687年', cat: 'science',

  { id: 'lathe', name: '精密机床', era: 4, year: '1600年', cat: 'mech',

  { id: 'steam_pump', name: '蒸汽泵', era: 4, year: '1698年', cat: 'energy',

<script>
(function () {
  'use strict';

  const CATS = {
    energy:   { label: '能源', color: '#ff922b' },
    material: { label: '材料', color: '#ff6b6b' },
    mech:     { label: '机械', color: '#ffd43b' },
    info:     { label: '信息', color: '#4dabf7' },
    compute:  { label: '计算', color: '#9775fa' },
    life:     { label: '生命', color: '#51cf66' },
    science:  { label: '科学', color: '#22d3ee' }
  };

  const H = 40, VGAP = 16, COLW = 300, SLOT = H + VGAP;
  const MIN_K = 0.06, MAX_K = 3;

  const svg = document.getElementById('tree');
  const world = document.getElementById('world');
  const bandsG = document.getElementById('bands');
  const edgesG = document.getElementById('edges');
  const nodesG = document.getElementById('nodes');
  const panelEl = document.getElementById('panel');
  const resultsEl = document.getElementById('results');
  const qEl = document.getElementById('q');
  const miniSvg = document.querySelector('#mini svg');
  const axisEl = document.getElementById('axis');

  /* ── 索引 ─────────────────────────────────── */
  const byId = new Map(NODES.map(n => [n.id, n]));
  NODES.forEach(n => { n.pre = (n.pre || []).filter(p => byId.has(p)); });
  const kids = new Map(NODES.map(n => [n.id, []]));
  NODES.forEach(n => n.pre.forEach(p => kids.get(p).push(n.id)));

  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // 交给 HTML 解析器解析 SVG 片段后再搬进目标节点：
  // WebKit 上直接给 SVG 元素赋 innerHTML 不一定生效，这个写法各家一致
  function fillSVG(el, markup) {
    const box = document.createElement('div');
    box.innerHTML = '<svg>' + markup + '</svg>';
    const src = box.firstElementChild;
    while (el.firstChild) el.removeChild(el.firstChild);
    while (src.firstChild) el.appendChild(src.firstChild);
  }

  function textW(s, size) {
    let w = 0;
    for (const ch of s) w += ch.codePointAt(0) > 0x2e80 ? size : size * 0.55;
    return w;
  }
  const nodeW = n => Math.min(240, Math.max(92,
    Math.round(Math.max(textW(n.name, 13.5), textW(n.year, 10.5)) + 34)));

  /* ── 分层布局：左右为时代，纵向用重心排序降低连线交叉 ── */
  const cols = ERAS.map(() => []);
  NODES.forEach(n => cols[n.era].push(n));

  const ord = new Map();
  cols.forEach(col => col.forEach((n, i) => ord.set(n.id, i)));

  // 同列内也存在依赖（如深度学习 -> 大语言模型），一并纳入重心计算，
  // 否则列内先后顺序只受邻近时代影响，会出现横跨整列的长连线。
  function bary(n, dir, e) {
    const list = (dir > 0 ? n.pre : kids.get(n.id)).map(id => byId.get(id))
      .filter(m => (dir > 0 ? m.era <= e : m.era >= e));
    if (!list.length) return ord.get(n.id);
    let s = 0;
    for (const m of list) s += ord.get(m.id);
    return s / list.length;
  }

  for (let it = 0; it < 12; it++) {
    const forward = it % 2 === 0;
    const start = forward ? 1 : ERAS.length - 2;
    const end = forward ? ERAS.length : -1;
    const step = forward ? 1 : -1;
    for (let e = start; e !== end; e += step) {
      cols[e].slice()
        .sort((a, b) => bary(a, forward ? 1 : -1, e) - bary(b, forward ? 1 : -1, e) || ord.get(a.id) - ord.get(b.id))
        .forEach((n, i) => ord.set(n.id, i));
    }
  }

  // 同列内再做一次稳定拓扑排序：以重心次序为优先级，保证前置节点一定排在衍生节点之前
  cols.forEach((col, e) => {
    const indeg = new Map(), adj = new Map();
    col.forEach(n => { indeg.set(n.id, 0); adj.set(n.id, []); });
    col.forEach(n => n.pre.forEach(pid => {
      const p = byId.get(pid);
      if (p.era === e) { indeg.set(n.id, indeg.get(n.id) + 1); adj.get(p.id).push(n.id); }
    }));
    const ready = col.filter(n => indeg.get(n.id) === 0);
    const out = [];
    while (ready.length) {
      let bi = 0;
      for (let i = 1; i < ready.length; i++) if (ord.get(ready[i].id) < ord.get(ready[bi].id)) bi = i;
      const n = ready.splice(bi, 1)[0];
      out.push(n);
      for (const k of adj.get(n.id)) {
        indeg.set(k, indeg.get(k) - 1);
        if (indeg.get(k) === 0) ready.push(byId.get(k));
      }
    }
    out.forEach((n, i) => ord.set(n.id, i));
  });

  const P = {};
  const maxTotal = Math.max(...cols.map(c => (c.length - 1) * SLOT));
  cols.forEach((col, e) => {
    const arr = col.slice().sort((a, b) => ord.get(a.id) - ord.get(b.id));
    const off = (maxTotal - (arr.length - 1) * SLOT) / 2;
    arr.forEach((n, i) => {
      P[n.id] = { x: e * COLW + COLW / 2, y: off + i * SLOT + H / 2, e: e, w: nodeW(n) };
    });
  });

  const minX = -20, maxX = ERAS.length * COLW + 20;
  const minY = -70, maxY = maxTotal + H + 70;
  const W = maxX - minX, HT = maxY - minY;

  /* ── 生成图元 ─────────────────────────────── */
  const bandParts = [];
  ERAS.forEach((era, e) => {
    const x = e * COLW;
    bandParts.push('<rect class="band' + (e % 2 ? ' alt' : '') + '" x="' + x + '" y="' + minY +
      '" width="' + COLW + '" height="' + HT + '"/>');
    bandParts.push('<line class="era-line" x1="' + x + '" y1="' + minY + '" x2="' + x + '" y2="' + maxY + '"/>');
  });
  bandParts.push('<line class="era-line" x1="' + (ERAS.length * COLW) + '" y1="' + minY + '" x2="' +
    (ERAS.length * COLW) + '" y2="' + maxY + '"/>');
  fillSVG(bandsG, bandParts.join(''));

  const edgeParts = [];
  NODES.forEach(n => n.pre.forEach(pid => {
    const a = P[pid], b = P[n.id];
    let d;
    if (a.e === b.e) {
      const xr = Math.max(a.x + a.w / 2, b.x + b.w / 2) + 58;
      d = 'M' + (a.x + a.w / 2) + ',' + a.y + ' C' + xr + ',' + a.y + ' ' + xr + ',' + b.y + ' ' +
        (b.x + b.w / 2) + ',' + b.y;
    } else {
      const x1 = a.x + a.w / 2, x2 = b.x - b.w / 2;
      const dx = Math.max(28, (x2 - x1) * 0.42);
      d = 'M' + x1 + ',' + a.y + ' C' + (x1 + dx) + ',' + a.y + ' ' + (x2 - dx) + ',' + b.y + ' ' + x2 + ',' + b.y;
    }
    edgeParts.push('<path class="edge" data-a="' + pid + '" data-b="' + n.id + '" d="' + d + '"/>');
  }));
  fillSVG(edgesG, edgeParts.join(''));

  const nodeParts = [];
  NODES.forEach(n => {
    const p = P[n.id], c = CATS[n.cat].color, hw = p.w / 2;
    nodeParts.push(
      '<g class="node" data-id="' + n.id + '" style="color:' + c + '" transform="translate(' + p.x + ' ' + p.y + ')">' +
      '<rect class="body" x="' + (-hw) + '" y="' + (-H / 2) + '" width="' + p.w + '" height="' + H + '" rx="9"/>' +
      '<rect class="accent" x="' + (-hw + 1.5) + '" y="' + (-H / 2 + 7) + '" width="3" height="' + (H - 14) + '" rx="1.5"/>' +
      '<text class="nm" x="' + (-hw + 14) + '" y="-9" dy=".35em">' + esc(n.name) + '</text>' +
      '<text class="yr" x="' + (-hw + 14) + '" y="9" dy=".35em">' + esc(n.year) + '</text>' +
      '<title>' + esc(n.name) + ' · ' + esc(n.year) + ' · ' + CATS[n.cat].label + '</title>' +
      '</g>');
  });
  fillSVG(nodesG, nodeParts.join(''));

  const nodeEls = Array.from(nodesG.children);
  const edgeEls = Array.from(edgesG.children);
  document.getElementById('stat').textContent = NODES.length + ' 项技术 · ' +
    NODES.reduce((s, n) => s + n.pre.length, 0) + ' 条依赖 · ' + ERAS.length + ' 个时代';

  /* ── 缩略图 ───────────────────────────────── */
  miniSvg.setAttribute('viewBox', minX + ' ' + minY + ' ' + W + ' ' + HT);
  miniSvg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
  const miniParts = NODES.map(n => {
    const p = P[n.id];
    return '<rect x="' + (p.x - p.w / 2) + '" y="' + (p.y - H / 2) + '" width="' + p.w + '" height="' + H +
      '" rx="6" fill="' + CATS[n.cat].color + '" opacity=".75"/>';
  }).join('') +
    '<rect x="' + minX + '" y="' + minY + '" width="' + W + '" height="' + HT +
    '" fill="none" stroke="#2b3849" stroke-width="4"/>';
  fillSVG(miniSvg, miniParts);
  const vpEl = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  vpEl.setAttribute('class', 'vp');
  miniSvg.appendChild(vpEl);
  miniSvg.setAttribute('width', 190);
  miniSvg.setAttribute('height', Math.round(190 * HT / W));

  /* ── 视图 ─────────────────────────────────── */
  const view = { x: 0, y: 0, k: 1 };
  const size = () => { const r = svg.getBoundingClientRect(); return { w: r.width, h: r.height }; };
  const clampK = k => Math.min(MAX_K, Math.max(MIN_K, k));

  function apply() {
    world.setAttribute('transform', 'translate(' + view.x + ' ' + view.y + ') scale(' + view.k + ')');
    const s = size();
    axisEls.forEach((el, e) => {
      const x0 = view.x + e * COLW * view.k, w = COLW * view.k;
      const vis = w >= 56 && x0 < s.w && x0 + w > 0;
      el.classList.toggle('hide', !vis);
      if (!vis) return;
      el.style.left = x0 + 'px';
      el.style.width = w + 'px';
      el.classList.toggle('narrow', w < 138);
    });
    const wx = (0 - view.x) / view.k, wy = (0 - view.y) / view.k;
    vpEl.setAttribute('x', wx); vpEl.setAttribute('y', wy);
    vpEl.setAttribute('width', s.w / view.k); vpEl.setAttribute('height', s.h / view.k);
  }

  let anim = null;
  function stopAnim() { if (anim) { cancelAnimationFrame(anim); anim = null; } }
  function animateTo(tx, ty, tk) {
    stopAnim();
    const s = { x: view.x, y: view.y, k: view.k }, t0 = performance.now();
    const dur = 420;
    (function step(t) {
      const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3);
      view.x = s.x + (tx - s.x) * e; view.y = s.y + (ty - s.y) * e; view.k = s.k + (tk - s.k) * e;
      apply();
      if (p < 1) anim = requestAnimationFrame(step); else anim = null;
    })(t0);
  }
  function zoomAt(px, py, factor, animate) {
    const tk = clampK(view.k * factor);
    const tx = px - (px - view.x) * (tk / view.k);
    const ty = py - (py - view.y) * (tk / view.k);
    if (animate) animateTo(tx, ty, tk); else { view.x = tx; view.y = ty; view.k = tk; apply(); }
  }
  function fit(animate) {
    const s = size(), pad = 30;
    const k = Math.min((s.w - pad * 2) / W, (s.h - pad * 2 - 60) / HT);
    const tx = s.w / 2 - (minX + W / 2) * k, ty = (s.h + 40) / 2 - (minY + HT / 2) * k;
    if (animate) animateTo(tx, ty, k); else { view.x = tx; view.y = ty; view.k = k; apply(); }
  }
  function home() {
    const s = size(), k = 0.85;
    view.k = k; view.x = 70 - minX * k; view.y = s.h / 2 - (minY + HT / 2) * k; apply();
  }

  /* ── 选中与高亮 ───────────────────────────── */
  let selected = null, hovered = null, catFilter = null, hits = new Set();

  function walk(id, dir, set) {
    set.add(id);
    const list = dir > 0 ? byId.get(id).pre : kids.get(id);
    for (const x of list) if (!set.has(x)) walk(x, dir, set);
  }
  function relate(id) { const s = new Set(); walk(id, 1, s); walk(id, -1, s); return s; }

  function refresh() {
    const focus = hovered || selected;
    const rel = focus ? relate(focus) : null;
    for (const el of nodeEls) {
      const id = el.dataset.id, cat = byId.get(id).cat;
      el.classList.toggle('sel', id === selected);
      el.classList.toggle('rel', !!rel && rel.has(id) && id !== selected);
      el.classList.toggle('dim', (!!rel && !rel.has(id)) || (!!catFilter && cat !== catFilter));
      el.classList.toggle('hit', hits.has(id));
    }
    for (const el of edgeEls) {
      const a = byId.get(el.dataset.a), b = byId.get(el.dataset.b);
      const on = !!rel && rel.has(a.id) && rel.has(b.id);
      el.classList.toggle('hl', on);
      el.classList.toggle('dim', (!!rel && !on) || (!!catFilter && (a.cat !== catFilter || b.cat !== catFilter)));
    }
  }

  const centerOf = id => {
    const s = size(), k = Math.max(view.k, 0.8), cy = s.w < 780 ? s.h * 0.34 : s.h * 0.5;
    return { x: s.w / 2 - P[id].x * k, y: cy - P[id].y * k, k: k };
  };

  function showPanel(id) {
    const n = byId.get(id), cat = CATS[n.cat];
    const ups = n.pre.map(x => byId.get(x)), downs = kids.get(id).map(x => byId.get(x));
    const chip = m => '<button class="chip" data-go="' + m.id + '" style="--c:' + CATS[m.cat].color + '">' +
      '<i></i>' + esc(m.name) + '<em>' + esc(m.year) + '</em></button>';
    panelEl.innerHTML =
      '<button class="close" data-close title="关闭">×</button>' +
      '<div class="catline" style="background:' + cat.color + '"></div>' +
      '<h2>' + esc(n.name) + '</h2>' +
      '<div class="meta">' +
        '<span class="tag">' + esc(ERAS[n.era].name) + '</span>' +
        '<span class="tag">' + esc(n.year) + '</span>' +
        '<span class="tag" style="color:' + cat.color + '">' + cat.label + '</span>' +
      '</div>' +
      '<p>' + esc(n.desc) + '</p>' +
      (ups.length ? '<h3>前置条件 · ' + ups.length + '</h3><div class="chips">' + ups.map(chip).join('') + '</div>' : '') +
      (downs.length ? '<h3>衍生技术 · ' + downs.length + '</h3><div class="chips">' + downs.map(chip).join('') + '</div>' : '');
    panelEl.classList.add('open');
  }

  function go(id, center) {
    selected = id;
    showPanel(id);
    refresh();
    if (center !== false) { const c = centerOf(id); animateTo(c.x, c.y, c.k); }
  }

  /* ── 交互：拖拽 / 缩放 ────────────────────── */
  const ptrs = new Map();
  let drag = null, pinch = null, moved = 0, downNode = null;

  svg.addEventListener('pointerdown', e => {
    stopAnim();
    try { svg.setPointerCapture(e.pointerId); } catch (err) { /* 个别实现会拒绝未激活的 pointerId */ }
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const r = svg.getBoundingClientRect();
    if (ptrs.size === 1) {
      drag = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y };
      moved = 0;
      const g = e.target.closest && e.target.closest('.node');
      downNode = g ? g.dataset.id : null;
      svg.classList.add('grabbing');
    } else if (ptrs.size === 2) {
      drag = null; downNode = null;
      const [a, b] = [...ptrs.values()];
      pinch = {
        d: Math.hypot(a.x - b.x, a.y - b.y),
        mx: (a.x + b.x) / 2 - r.left, my: (a.y + b.y) / 2 - r.top,
        x: view.x, y: view.y, k: view.k
      };
    }
  });

  svg.addEventListener('pointermove', e => {
    if (!ptrs.has(e.pointerId)) return;
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const r = svg.getBoundingClientRect();
    if (ptrs.size >= 2 && pinch) {
      const [a, b] = [...ptrs.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y) || 1;
      const mx = (a.x + b.x) / 2 - r.left, my = (a.y + b.y) / 2 - r.top;
      const k = clampK(pinch.k * (d / pinch.d)), ratio = k / pinch.k;
      view.k = k;
      view.x = mx - (pinch.mx - pinch.x) * ratio;
      view.y = my - (pinch.my - pinch.y) * ratio;
      apply();
    } else if (drag) {
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      if (Math.abs(dx) + Math.abs(dy) > 4) moved = 1;
      view.x = drag.vx + dx; view.y = drag.vy + dy;
      apply();
    }
  });

  function endPointer(e) {
    if (!ptrs.has(e.pointerId)) return;
    ptrs.delete(e.pointerId);
    if (ptrs.size === 0) {
      if (!moved && downNode) go(downNode, false);
      drag = null; pinch = null; downNode = null;
      svg.classList.remove('grabbing');
    } else if (ptrs.size === 1) {
      pinch = null;
      const p = [...ptrs.values()][0];
      drag = { x: p.x, y: p.y, vx: view.x, vy: view.y };
    }
  }
  svg.addEventListener('pointerup', endPointer);
  svg.addEventListener('pointercancel', endPointer);

  svg.addEventListener('wheel', e => {
    e.preventDefault();
    stopAnim();
    const r = svg.getBoundingClientRect();
    zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY * 0.0016), false);
  }, { passive: false });

  // iOS 会把自己的双指手势看成页面缩放，这里自己接管
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(ev =>
    svg.addEventListener(ev, e => e.preventDefault()));

  /* ── 交互：悬停 ───────────────────────────── */
  nodesG.addEventListener('mouseover', e => {
    const g = e.target.closest && e.target.closest('.node');
    if (g && g.dataset.id !== hovered) { hovered = g.dataset.id; refresh(); }
  });
  nodesG.addEventListener('mouseout', e => {
    if (e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest('.node')) return;
    if (hovered) { hovered = null; refresh(); }
  });

  /* ── 交互：搜索 / 图例 / 工具 / 缩略图 ─────── */
  function search(v) {
    hits = new Set();
    const s = v.trim();
    if (s) NODES.forEach(n => {
      if (n.name.includes(s) || n.desc.includes(s) || n.year.includes(s) || CATS[n.cat].label.includes(s))
        hits.add(n.id);
    });
    const list = [...hits].slice(0, 24);
    resultsEl.innerHTML = list.map(id => {
      const n = byId.get(id);
      return '<button class="res" data-go="' + id + '">' + esc(n.name) +
        '<span>' + esc(ERAS[n.era].name) + ' · ' + esc(n.year) + '</span></button>';
    }).join('');
    resultsEl.classList.toggle('open', !!s && list.length > 0);
    refresh();
  }
  qEl.addEventListener('input', () => search(qEl.value));
  qEl.addEventListener('keydown', e => {
    if (e.key === 'Escape') { qEl.value = ''; search(''); resultsEl.classList.remove('open'); }
    if (e.key === 'Enter') { const f = [...hits][0]; if (f) { go(f); resultsEl.classList.remove('open'); } }
  });

  resultsEl.addEventListener('click', e => {
    const b = e.target.closest('[data-go]');
    if (b) { go(b.dataset.go); resultsEl.classList.remove('open'); qEl.blur(); }
  });

  const legendEl = document.getElementById('legend');
  legendEl.innerHTML = Object.keys(CATS).map(k =>
    '<button class="lg" data-cat="' + k + '" style="color:' + CATS[k].color + '"><i></i>' + CATS[k].label + '</button>'
  ).join('');
  legendEl.addEventListener('click', e => {
    const b = e.target.closest('[data-cat]');
    if (!b) return;
    catFilter = catFilter === b.dataset.cat ? null : b.dataset.cat;
    [...legendEl.children].forEach(el => el.classList.toggle('on', el.dataset.cat === catFilter));
    refresh();
  });

  document.querySelector('.tools').addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const s = size();
    const act = b.dataset.act;
    if (act === 'in') zoomAt(s.w / 2, s.h / 2, 1.35, true);
    if (act === 'out') zoomAt(s.w / 2, s.h / 2, 1 / 1.35, true);
    if (act === 'fit') fit(true);
    if (act === 'reset') { qEl.value = ''; search(''); home(); }
  });

  panelEl.addEventListener('click', e => {
    const x = e.target.closest('[data-close]');
    if (x) { panelEl.classList.remove('open'); selected = null; refresh(); return; }
    const g = e.target.closest('[data-go]');
    if (g) go(g.dataset.go);
  });

  const axisEls = ERAS.map(era => {
    const el = document.createElement('div');
    el.className = 'ey hide';
    el.innerHTML = '<b>' + esc(era.name) + '</b><s>' + esc(era.sub) + '</s>';
    axisEl.appendChild(el);
    return el;
  });
  const hdrEl = document.querySelector('header');
  function syncHdr() {
    document.documentElement.style.setProperty('--hdr', hdrEl.offsetHeight + 'px');
    apply();
  }
  if (window.ResizeObserver) new ResizeObserver(syncHdr).observe(hdrEl);
  else window.addEventListener('resize', syncHdr);
  syncHdr();

  const mini = document.getElementById('mini');
  mini.addEventListener('pointerdown', e => {
    e.stopPropagation();
    const r = miniSvg.getBoundingClientRect();
    const wx = minX + (e.clientX - r.left) / r.width * W;
    const wy = minY + (e.clientY - r.top) / r.height * HT;
    const s = size();
    animateTo(s.w / 2 - wx * view.k, s.h / 2 - wy * view.k, view.k);
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { panelEl.classList.remove('open'); selected = null; refresh(); }
    if (e.key === '+' || e.key === '=') { const s = size(); zoomAt(s.w / 2, s.h / 2, 1.35, true); }
    if (e.key === '-') { const s = size(); zoomAt(s.w / 2, s.h / 2, 1 / 1.35, true); }
    if (e.key === '0') fit(true);
  });

  window.addEventListener('resize', apply);

  // 打开时从最早的几列开始，避免整图缩得太小
  home();
})();
</script>
</body>
</html>
